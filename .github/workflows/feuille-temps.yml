name: Feuille de temps (secours manuel)

# PAS de planification : l envoi se declenche depuis le CRM (carte
# Comptabilite de Smart RH, decision Louis). Ce workflow reste comme
# solution de secours, lancable a la main depuis GitHub uniquement.
on:
  workflow_dispatch:

jobs:
  envoyer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --omit=dev --ignore-scripts
      - name: Generer et envoyer la feuille de temps
        run: node scripts/rh/feuille-temps-mensuelle.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          COMPTABLE_EMAIL: ${{ vars.COMPTABLE_EMAIL }}
